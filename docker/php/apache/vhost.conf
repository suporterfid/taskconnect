<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Production mounts TaskConnect under /tc. Mirror that asset path locally so
    # Vite's production dynamic imports are exercised by Docker Playwright.
    Alias /tc/build/ /var/www/html/public/build/

    <Directory /var/www/html/public/build>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
